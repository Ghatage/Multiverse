<!doctype html><html lang="en"><meta charset="utf-8"><title>Workspace · Demo</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111519;color:#eef1f3;font:20px Arial,sans-serif}header{height:80px;border-bottom:1px solid #30363c;padding:25px 44px;display:flex;justify-content:space-between}.tag{color:#8bd5b5;font-size:14px;letter-spacing:2px}aside{position:absolute;top:80px;bottom:0;width:235px;padding:45px 30px;border-right:1px solid #30363c;color:#a0a6ac;line-height:3}main{margin:65px 70px 0 295px;max-width:950px}h1{font-size:44px;letter-spacing:-1.5px;margin:18px 0}p{color:#a8b3bb;line-height:1.6}section{background:#1b2228;border:1px solid #35404a;border-radius:14px;padding:35px;margin-top:35px}label{display:block;margin-bottom:16px;color:#c8d0d6}input{display:block;background:#10161b;border:1px solid #52616d;padding:16px;color:white;width:100%;font-size:22px;border-radius:5px}button{background:#c3b1ea;color:#17121f;border:0;border-radius:7px;padding:18px 30px;font-size:20px;margin-top:24px;cursor:pointer}.row{display:flex;justify-content:space-between;padding:22px 0;border-bottom:1px solid #35404a}small{font-size:14px;color:#84919b}.success{color:#8bd5b5}.crumb{font-size:15px;letter-spacing:2px;color:#c3b1ea}</style>
<header><b>FIELDWORK <span style="font-weight:400;color:#8a969f">/ Operations</span></b><span class="tag">LOCAL DEMONSTRATION</span></header>
<aside>Overview<br>Requests<br>Documents<br>Exports<br><small>Isolated demo workspace</small></aside><main id="main"></main>
<script>
const kind=new URLSearchParams(location.search).get('flow')||'travel';
const names={travel:'Travel request',equipment:'Equipment request',onboarding:'Onboarding checklist'};
const label=names[kind]; let step=0;
const content=[
()=>`<span class="crumb">WORKSPACE / ${kind.toUpperCase()}</span><h1>${label}</h1><p>Prepare a local draft, review the details, and save the result.</p><section><div class="row"><span>Workflow</span><b>${label}</b></div><div class="row"><span>Environment</span><b>Demonstration</b></div><button id="next">Start request</button></section>`,
()=>`<span class="crumb">STEP 1 / PREPARE</span><h1>Prepare ${label.toLowerCase()}</h1><p>Confirm the prepared details before review.</p><section><div class="row"><span>Owner</span><b>Demo operator</b></div><div class="row"><span>Destination</span><b>Local workspace</b></div><div class="row"><span>Document</span><b>${kind}-draft.csv</b></div><button id="next">Review details</button></section>`,
()=>`<span class="crumb">STEP 2 / REVIEW</span><h1>Review ${label.toLowerCase()}</h1><p>Everything remains inside this demonstration workspace.</p><section><div class="row"><span>Details</span><b class="success">Ready</b></div><div class="row"><span>Storage</span><b>Local draft</b></div><div class="row"><span>External submission</span><b>None</b></div><button id="next">Save local draft</button></section>`,
()=>`<span class="crumb">STEP 3 / SAVED</span><h1>${label} saved</h1><p class="success">The local demonstration workflow is complete.</p><section><div class="row"><span>State</span><b class="success">Saved</b></div><div class="row"><span>Record</span><b>${kind}-draft</b></div><div class="row"><span>Scope</span><b>Local only</b></div><p>No external action was taken.</p></section>`];
function render(){document.title=`${label} · ${['Start','Prepare','Review','Saved'][step]}`;document.getElementById('main').innerHTML=content[step]();const b=document.getElementById('next');if(b)b.onclick=()=>{step++;history.replaceState(null,'',location.pathname+location.search+'#'+(step===3?'saved':step));render()}}
render();
</script></html>
