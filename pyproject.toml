[project]
name = "fork-runtime"
version = "0.1.0"
description = "Branchable Debian computer-use desktops for Apple Silicon Macs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai[realtime]>=3.8.0",
  "typer>=0.15",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "rich>=13",
]

[tool.uv]
package = true
required-version = ">=0.12.1"
exclude-newer = "2026-09-09T00:00:00Z"

[project.scripts]
cu = "fork.cu.cli:app"
fork-agent = "fork.agent.cli:app"
fork-store = "fork.store.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fork*", "env.scripts*"]

[tool.setuptools.package-data]
"fork.store" = ["schema.sql"]
